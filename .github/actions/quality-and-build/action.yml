name: Quality and build
description: Install dependencies, run quality checks, and build the app. Assumes the repo is already checked out.

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: npm ci
      shell: bash

    - name: Install Playwright browser
      run: npx playwright install --with-deps chromium
      shell: bash

    - name: Run end-to-end tests
      run: npm run test:e2e
      shell: bash

    - name: Check formatting
      run: npm run format:check
      shell: bash

    - name: Lint
      run: npm run lint
      shell: bash

    - name: Type check
      run: npm run typecheck
      shell: bash

    - name: Build
      run: npm run build
      shell: bash
